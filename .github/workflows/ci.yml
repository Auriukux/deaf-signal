name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: node --test test/*.test.js

      - name: Typecheck declarations
        run: npx --yes -p typescript@5.6.3 tsc --noEmit --module nodenext --moduleResolution nodenext --target es2022 --strict src/index.d.ts src/signals.d.ts src/presets.d.ts src/notify.d.ts src/alerts.d.ts
