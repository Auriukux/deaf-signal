<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="deaf-signal" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>deaf-signal — demonstracija</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #070b12;
      --bg-1: #0c1220;
      --fg: #eef3fb;
      --muted: #93a0b8;
      --muted-2: #6b7a94;
      --accent: #5ec8ff;
      --accent-soft: rgba(94, 200, 255, 0.14);
      --glass: rgba(18, 28, 46, 0.62);
      --glass-border: rgba(148, 173, 214, 0.18);
      --glass-highlight: rgba(255, 255, 255, 0.06);
      --btn-primary: linear-gradient(180deg, #2f7fe0 0%, #1b5fbc 100%);
      --btn-primary-solid: #1e6fd0;
      --btn-warn: linear-gradient(180deg, #ffd166 0%, #f0a202 100%);
      --btn-warn-fg: #1a1408;
      --btn-urgent: linear-gradient(180deg, #ef5350 0%, #c62828 100%);
      --btn-secondary: rgba(255, 255, 255, 0.06);
      --btn-secondary-border: rgba(148, 173, 214, 0.22);
      --ring: #7dd3fc;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      --radius: 8px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      padding: 28px 16px 56px;
      background:
        radial-gradient(900px 480px at 12% -10%, rgba(56, 132, 255, 0.22), transparent 55%),
        radial-gradient(700px 420px at 92% 8%, rgba(120, 80, 255, 0.16), transparent 50%),
        radial-gradient(600px 380px at 50% 110%, rgba(34, 197, 180, 0.08), transparent 45%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      background-attachment: fixed;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      flex-shrink: 0;
      display: block;
      object-fit: cover;
    }

    .brand-word {
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--fg);
    }

    .brand-badge {
      margin-left: 2px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(94, 200, 255, 0.28);
      padding: 3px 7px;
      border-radius: 4px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(1.55rem, 4.5vw, 1.85rem);
      margin: 0;
      letter-spacing: -0.035em;
      font-weight: 720;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      max-width: 36ch;
    }

    .lang-toggle {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-shrink: 0;
      box-shadow: 0 1px 0 var(--glass-highlight) inset;
    }

    .lang-toggle button {
      appearance: none;
      border: none;
      border-radius: 4px;
      padding: 7px 13px;
      font-size: 0.78rem;
      font-weight: 720;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      text-align: center;
      min-width: 42px;
      transition: background 160ms var(--ease), color 160ms var(--ease), box-shadow 160ms var(--ease);
    }

    .lang-toggle button[aria-pressed="true"] {
      background: linear-gradient(180deg, #2f7fe0, #1b5fbc);
      color: #fff;
      box-shadow: 0 6px 16px rgba(30, 111, 208, 0.35);
    }

    .lang-toggle button:hover:not([aria-pressed="true"]) {
      color: var(--fg);
      background: rgba(255, 255, 255, 0.05);
    }

    .lang-toggle button:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
      z-index: 1;
    }

    .lead {
      color: var(--muted);
      margin: 0 0 22px;
      line-height: 1.55;
      font-size: 0.98rem;
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 18px;
      display: grid;
      gap: 10px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      opacity: 0.7;
      pointer-events: none;
    }

    .card > button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 14px 16px;
      font-size: 0.98rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      cursor: pointer;
      color: #fff;
      text-align: left;
      background: var(--btn-primary);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.18) inset,
        0 8px 18px rgba(27, 95, 188, 0.28);
      transition:
        transform 140ms var(--ease),
        box-shadow 140ms var(--ease),
        filter 140ms var(--ease),
        background 140ms var(--ease);
    }

    .card > button:hover {
      filter: brightness(1.06);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.22) inset,
        0 12px 24px rgba(27, 95, 188, 0.36);
    }

    .card > button:active {
      transform: translateY(1px) scale(0.992);
      filter: brightness(0.97);
    }

    .card > button.warn {
      background: var(--btn-warn);
      color: var(--btn-warn-fg);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.35) inset,
        0 8px 18px rgba(240, 162, 2, 0.28);
    }

    .card > button.warn:hover {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.4) inset,
        0 12px 24px rgba(240, 162, 2, 0.36);
    }

    .card > button.urgent {
      background: var(--btn-urgent);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.18) inset,
        0 8px 18px rgba(198, 40, 40, 0.32);
    }

    .card > button.urgent:hover {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.22) inset,
        0 12px 24px rgba(198, 40, 40, 0.4);
    }

    .card > button.secondary {
      background: var(--btn-secondary);
      border-color: var(--btn-secondary-border);
      color: var(--fg);
      box-shadow: 0 1px 0 var(--glass-highlight) inset;
    }

    .card > button.secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 1px 0 var(--glass-highlight) inset, 0 8px 18px rgba(0, 0, 0, 0.2);
    }

    .card > button:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 3px;
    }


    #btn-install {
      display: none;
      width: 100%;
      margin-top: 12px;
      appearance: none;
      border: 1px solid rgba(94, 200, 255, 0.35);
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      cursor: pointer;
      color: var(--fg);
      text-align: center;
      background: var(--accent-soft);
      box-shadow: 0 1px 0 var(--glass-highlight) inset;
      transition: background 140ms var(--ease), filter 140ms var(--ease);
    }

    #btn-install:hover {
      background: rgba(94, 200, 255, 0.22);
      filter: brightness(1.05);
    }

    #btn-install:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 3px;
    }

    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.035);
      box-shadow: 0 1px 0 var(--glass-highlight) inset;
    }

    .status-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 720;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .hint {
      margin: 0;
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.55;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.84em;
      background: rgba(0, 0, 0, 0.35);
      color: #d7e6ff;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid rgba(148, 173, 214, 0.15);
    }


    .listen-card {
      margin-top: 0;
    }

    .listen-meter-wrap {
      position: relative;
      height: 14px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(148, 173, 214, 0.2);
      overflow: hidden;
      margin: 4px 0 2px;
    }

    .listen-meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, #2f7fe0, #5ec8ff 55%, #ef5350);
      transition: width 80ms linear;
    }

    .listen-meter-threshold {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255, 209, 102, 0.95);
      box-shadow: 0 0 6px rgba(240, 162, 2, 0.55);
      transform: translateX(-1px);
      pointer-events: none;
    }

    .listen-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-bottom: 4px;
    }

    .listen-status {
      margin: 2px 0 0;
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.45;
      min-height: 1.3em;
    }

    .listen-status.fired {
      color: #ffd166;
      font-weight: 650;
    }

    .listen-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .listen-row > button {
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .listen-meter-fill {
        transition: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .lang-toggle button,
      .card > button {
        transition: none;
      }
      .card > button:hover,
      .card > button:active {
        transform: none;
        filter: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">
      <img class="brand-mark" src="./icons/icon-192.png" alt="" width="28" height="28" />
      <span class="brand-word">deaf-signal</span>
      <span class="brand-badge" data-i18n="badge">a11y</span>
    </div>

    <div class="header">
      <div>
        <h1>deaf-signal</h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" id="lang-lt" aria-pressed="true">LT</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>

    <p class="lead" data-i18n="lead"></p>
    <p class="hint" style="margin-top:-4px;margin-bottom:14px" data-i18n="photoWarn"></p>

    <div class="card">
      <button type="button" id="btn-flash" data-i18n="btnFlash"></button>
      <button type="button" id="btn-banner" class="warn" data-i18n="btnBanner"></button>
      <button type="button" id="btn-vibrate" class="secondary" data-i18n="btnVibrate"></button>
      <button type="button" id="btn-combo" class="urgent" data-i18n="btnCombo"></button>
      <button type="button" id="btn-pulse" class="secondary" data-i18n="btnPulse"></button>
      <button type="button" id="btn-notify-perm" class="secondary" data-i18n="btnNotifyPerm"></button>
      <button type="button" id="btn-notify-test" class="warn" data-i18n="btnNotifyTest"></button>
    </div>

    <p class="lead" style="margin-top:22px;margin-bottom:10px" data-i18n="productLead"></p>
    <div class="card" id="product-alerts">
      <button type="button" id="btn-alert-call" class="secondary" data-i18n="btnAlertCall"></button>
      <button type="button" id="btn-alert-door" class="warn" data-i18n="btnAlertDoor"></button>
      <button type="button" id="btn-alert-horn" class="urgent" data-i18n="btnAlertHorn"></button>
      <button type="button" id="btn-alert-siren" class="urgent" data-i18n="btnAlertSiren"></button>
    </div>


    <p class="lead" style="margin-top:22px;margin-bottom:10px" data-i18n="listenLead"></p>
    <div class="card listen-card" id="loud-listen">
      <p class="listen-meta">
        <span data-i18n="listenLevelLabel">Level</span>
        <span id="listen-level-readout">0%</span>
      </p>
      <div class="listen-meter-wrap" aria-hidden="true">
        <div class="listen-meter-fill" id="listen-meter-fill"></div>
        <div class="listen-meter-threshold" id="listen-meter-threshold"></div>
      </div>
      <p class="listen-status" id="listen-status" data-i18n="listenIdle"></p>
      <div class="listen-row">
        <button type="button" id="btn-listen-start" class="warn" data-i18n="btnListenStart"></button>
        <button type="button" id="btn-listen-stop" class="secondary" data-i18n="btnListenStop"></button>
      </div>
      <p class="hint" style="margin:4px 0 0" data-i18n="listenHint"></p>
    </div>

    <button type="button" id="btn-install" data-i18n="btnInstall" hidden></button>

    <div class="status">
      <span class="status-label" data-i18n="statusLabel">Hint</span>
      <p class="hint" data-i18n-html="hint"></p>
    </div>
  </main>
  <script type="module">
    import {
      flashScreen,
      showBanner,
      vibratePattern,
      alertCombo,
      pulseBorder,
      requestNotifyPermission,
      notifyAlert,
      getNotifyPermission,
      isNotificationSupported,
      runAlert,
      startLoudListen,
      stopLoudListen,
      isListenSupported,
      DEFAULT_LOUD_THRESHOLD,
    } from "../src/index.js";

    const LANG_KEY = "deaf-signal-demo-lang";

    const strings = {
      lt: {
        title: "deaf-signal — demonstracija",
        subtitle: "Produktinė demonstracija — vizualūs įspėjimai be garso.",
        badge: "a11y",
        lead:
          "Vizualūs ir haptic (vibracijos) įspėjimai be garso — prieinamumas kurtiesiems ir neprigirdintiems.",
        photoWarn:
          "Įspėjimas: ekrano mirksėjimas gali sukelti fotosensityvią reakciją / epilepsiją — mirksiai ribojami.",
        btnFlash: "Mirksėti ekraną",
        btnBanner: "Rodyti juostą",
        btnVibrate: "Vibruoti / drebėti",
        btnCombo: "Kombinuotas įspėjimas",
        btnPulse: "Pulsuoti rėmelį",
        statusLabel: "Pastaba",
        hint:
          "Vibracija arba vizualus drebėjimas — vibracija veikia daugelyje mobiliųjų Chrome / Android; iPhone Safari <code>navigator.vibrate</code> neveikia (tik vizualus drebėjimas). Mirksėjimas ribojamas (fotosensityvumas / epilepsija). Foniniai pranešimai eina per Service Worker (geriau veikia įdiegus kaip PWA); skirtuką galima uždaryti fone; visiškai išjungta programėlė — OS riboja (ypač iOS). Importas: <code>../src/index.js</code>",
        banner: "⚠️ Dėmesio: svarbus pranešimas.",
        combo: "Skubus įspėjimas — patikrinkite pranešimą!",
        vibrateFail: "Vibracija ir drebėjimas nepalaikomi šiame kontekste.",
        langGroup: "Kalba",
        btnNotifyPerm: "Leisti pranešimus",
        btnNotifyTest: "Foninis testas (SW / PWA)",
        notifyGranted: "Pranešimų leidimas suteiktas.",
        notifyDenied: "Pranešimai atmesti arba nepalaikomi.",
        notifyDefault: "Leidimas dar nesuteiktas — spauskite „Leisti pranešimus“.",
        notifyUnsupported: "Notification API šiame naršyklėje nepalaikomas.",
        notifyTitle: "deaf-signal",
        notifyBody: "SW foninis įspėjimas — geriau veikia įdiegus kaip PWA.",
        notifySent: "Po ~2.5 s — SW pranešimas. Geriau veikia įdiegus kaip PWA; skirtuką galima uždaryti fone; visiškai išjungta programėlė — OS riboja (ypač iOS).",
        btnInstall: "Įdiegti programėlę",
        productLead: "Rankiniai produkto signalai (skubus / garsus / durys / skambutis) — jūs paleidžiate; ne atpažinimas. Vizualu + vibracija, be ML:",
        btnAlertCall: "Skambutis",
        btnAlertDoor: "Durys",
        btnAlertHorn: "Garsus signalas",
        btnAlertSiren: "Skubus signalas",
        alertCallMsg: "Įeinantis skambutis",
        alertDoorMsg: "Durys / skambutis į duris",
        alertHornMsg: "Garsus signalas",
        listenLead: "Mikrofonas: tik garsumo pikas (loudPeak) — ne sirenos atpažinimas; atskirai nuo rankinių produkto signalų:",
        btnListenStart: "Įjungti klausymą",
        btnListenStop: "Stabdyti",
        listenLevelLabel: "Lygis",
        listenIdle: "Laukia…",
        listenListening: "Klauso — tik garsumo pikas (ne sirenos atpažinimas).",
        listenFired: "Stipraus garsumo pikas!",
        listenDenied: "Mikrofono leidimas atmestas arba nepalaikomas.",
        listenUnsupported: "Mikrofono klausymas nepalaikomas šiame kontekste (reikia HTTPS / localhost).",
        listenHint: "RMS matuoja garsumą, ne įvykio tipą — suveikia tik stiprūs garsumo pikiai; šnabždesys neturėtų paleisti.",
        alertSirenMsg: "Skubus signalas",
        close: "Uždaryti",
      },
      en: {
        title: "deaf-signal — demo",
        subtitle: "Product demo — visual alerts without sound.",
        badge: "a11y",
        lead:
          "Visual and haptic alerts without relying on sound — accessibility for deaf / hard-of-hearing.",
        photoWarn:
          "Warning: screen flashes can affect people with photosensitive epilepsy — flashes are rate-limited.",
        btnFlash: "Flash screen",
        btnBanner: "Show banner",
        btnVibrate: "Vibrate / shake",
        btnCombo: "Combined alert",
        btnPulse: "Pulse border",
        statusLabel: "Hint",
        hint:
          "Vibration or visual shake — works on many Chrome / Android devices; iPhone Safari <code>navigator.vibrate</code> does not (visual shake only). Flashes are rate-limited (photosensitive epilepsy warning). Background alerts use the Service Worker path (works better when installed as a PWA); the tab can be backgrounded; a fully killed app is still OS-limited (esp. iOS). Import: <code>../src/index.js</code>",
        banner: "⚠️ Attention: important notice.",
        combo: "Urgent alert — check the message!",
        vibrateFail: "Vibration and shake are not supported in this context.",
        langGroup: "Language",
        btnNotifyPerm: "Allow notifications",
        btnNotifyTest: "Background test (SW / PWA)",
        notifyGranted: "Notification permission granted.",
        notifyDenied: "Notifications denied or unsupported.",
        notifyDefault: "Permission not granted yet — tap “Allow notifications”.",
        notifyUnsupported: "Notification API is not supported in this browser.",
        notifyTitle: "deaf-signal",
        notifyBody: "SW background alert — works better when installed as a PWA.",
        notifySent: "SW alert in ~2.5s — works better when installed as a PWA; tab can be backgrounded; fully killed app is still OS-limited (esp. iOS).",
        btnInstall: "Install app",
        productLead: "Manual product cues (urgent / loud / door / call) — you trigger them; not classifiers. Visual + haptic, no ML:",
        btnAlertCall: "Call",
        btnAlertDoor: "Door",
        btnAlertHorn: "Loud cue",
        btnAlertSiren: "Urgent cue",
        alertCallMsg: "Incoming call",
        alertDoorMsg: "Door / doorbell",
        alertHornMsg: "Loud cue",
        listenLead: "Mic: loudness peak only — not siren recognition; separate from manual product cues:",
        btnListenStart: "Start listening",
        btnListenStop: "Stop",
        listenLevelLabel: "Level",
        listenIdle: "Idle…",
        listenListening: "Listening — loudness peak only (not siren recognition).",
        listenFired: "Strong loudness peak!",
        listenDenied: "Microphone permission denied or unsupported.",
        listenUnsupported: "Mic listen is not supported here (needs HTTPS / localhost).",
        listenHint: "RMS measures loudness, not event type — only strong loudness peaks fire; whispering should not.",
        alertSirenMsg: "Urgent cue",
        close: "Close",
      },
    };

    let lang =
      localStorage.getItem(LANG_KEY) === "en" ||
      localStorage.getItem(LANG_KEY) === "lt"
        ? localStorage.getItem(LANG_KEY)
        : "lt";

    function demoBanner(message, opts = {}) {
      return showBanner(message, {
        closeLabel: strings[lang].close,
        ...opts,
      });
    }

    function applyLang(next) {
      lang = next === "en" ? "en" : "lt";
      localStorage.setItem(LANG_KEY, lang);
      const t = strings[lang];
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelector(".lang-toggle").setAttribute("aria-label", t.langGroup);
      document.getElementById("lang-lt").setAttribute("aria-pressed", String(lang === "lt"));
      document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t[el.getAttribute("data-i18n")] || "";
      });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        el.innerHTML = t[el.getAttribute("data-i18n-html")] || "";
      });
    }

    document.getElementById("lang-lt").addEventListener("click", () => applyLang("lt"));
    document.getElementById("lang-en").addEventListener("click", () => applyLang("en"));
    applyLang(lang);

    document.getElementById("btn-flash").addEventListener("click", () => {
      flashScreen({ durationMs: 350 });
    });

    document.getElementById("btn-banner").addEventListener("click", () => {
      demoBanner(strings[lang].banner, {
        level: "warn",
        durationMs: 4000,
      });
    });

    document.getElementById("btn-vibrate").addEventListener("click", () => {
      const ok = vibratePattern([120, 60, 120, 60, 240], {
        target: document.querySelector(".card"),
        shakeFallback: true,
      });
      if (!ok) {
        demoBanner(strings[lang].vibrateFail, {
          level: "info",
          durationMs: 3500,
        });
      }
    });

    document.getElementById("btn-combo").addEventListener("click", () => {
      alertCombo(strings[lang].combo, {
        level: "urgent",
        shakeTarget: ".card",
        closeLabel: strings[lang].close,
      });
    });

    document.getElementById("btn-pulse").addEventListener("click", () => {
      const card = document.querySelector(".card");
      pulseBorder(card, { color: "#5ec8ff", times: 3, durationMs: 1000 });
    });

    document.getElementById("btn-notify-perm").addEventListener("click", async () => {
      if (!isNotificationSupported()) {
        demoBanner(strings[lang].notifyUnsupported, { level: "warn", durationMs: 4000 });
        return;
      }
      const perm = await requestNotifyPermission();
      const t = strings[lang];
      let msg = t.notifyDefault;
      let level = "info";
      if (perm === "granted") {
        msg = t.notifyGranted;
        level = "info";
      } else if (perm === "denied" || perm === "unsupported") {
        msg = perm === "unsupported" ? t.notifyUnsupported : t.notifyDenied;
        level = "warn";
      }
      demoBanner(msg, { level, durationMs: 4000 });
    });

    document.getElementById("btn-notify-test").addEventListener("click", async () => {
      const t = strings[lang];
      if (!isNotificationSupported()) {
        demoBanner(t.notifyUnsupported, { level: "warn", durationMs: 3500 });
        return;
      }
      const perm = getNotifyPermission();
      // Without granted permission, only show honest status — do not delay then
      // flash/combo the screen as if a background notification ran.
      if (perm === "denied" || perm === "unsupported") {
        demoBanner(t.notifyDenied, { level: "warn", durationMs: 3500 });
        return;
      }
      if (perm !== "granted") {
        demoBanner(t.notifyDefault, { level: "info", durationMs: 3500 });
        return;
      }
      demoBanner(t.notifySent, { level: "info", durationMs: 2500 });
      // Delay so the user can background the tab; notifyAlert prefers SW showNotification.
      await new Promise((r) => setTimeout(r, 2500));
      await notifyAlert(t.notifyTitle, {
        body: t.notifyBody,
        level: "urgent",
        tag: "deaf-signal-demo",
        icon: new URL("./icons/icon-192.png", location.href).href,
        flash: true,
        shake: true,
        combo: true,
        shakeTarget: document.querySelector(".card"),
      });
    });

    function productAlert(name, msgKey) {
      const t = strings[lang];
      return runAlert(name, {
        message: t[msgKey],
        closeLabel: t.close,
        shakeTarget: document.querySelector("#product-alerts") || document.querySelector("main") || document.body,
      });
    }

    document.getElementById("btn-alert-call").addEventListener("click", () => {
      productAlert("call", "alertCallMsg");
    });
    document.getElementById("btn-alert-door").addEventListener("click", () => {
      productAlert("door", "alertDoorMsg");
    });
    document.getElementById("btn-alert-horn").addEventListener("click", () => {
      productAlert("horn", "alertHornMsg");
    });
    document.getElementById("btn-alert-siren").addEventListener("click", () => {
      productAlert("siren", "alertSirenMsg");
    });


    // Optional mic loudness-peak listen (strong RMS — not a siren classifier)
    const listenFill = document.getElementById("listen-meter-fill");
    const listenThresholdMark = document.getElementById("listen-meter-threshold");
    const listenReadout = document.getElementById("listen-level-readout");
    const listenStatus = document.getElementById("listen-status");
    let listenCtrl = null;

    function setListenThresholdMark() {
      const pct = Math.round(DEFAULT_LOUD_THRESHOLD * 100);
      listenThresholdMark.style.left = pct + "%";
    }
    setListenThresholdMark();

    function setListenStatus(key, fired) {
      const t = strings[lang];
      listenStatus.textContent = t[key] || "";
      listenStatus.classList.toggle("fired", !!fired);
      if (key === "listenIdle" || key === "listenListening") {
        listenStatus.setAttribute("data-i18n", key);
      } else {
        listenStatus.removeAttribute("data-i18n");
      }
    }

    function updateListenMeter(rms) {
      const pct = Math.max(0, Math.min(100, Math.round(rms * 100)));
      listenFill.style.width = pct + "%";
      listenReadout.textContent = pct + "%";
    }

    document.getElementById("btn-listen-start").addEventListener("click", async () => {
      if (!isListenSupported()) {
        setListenStatus("listenUnsupported", false);
        demoBanner(strings[lang].listenUnsupported, { level: "warn", durationMs: 4000 });
        return;
      }
      try {
        stopLoudListen();
        listenCtrl = await startLoudListen({
          threshold: DEFAULT_LOUD_THRESHOLD,
          minIntervalMs: 2500,
          // loudPeak only — never wire mic to ALERT_SIREN / door / horn
          alert: "urgent",
          // Default: keep listening while tab is hidden; stop on unload / explicit stop
          stopOnHidden: false,
          alertOpts: {
            shakeTarget: document.querySelector("#loud-listen") || document.querySelector("main") || document.body,
            message: strings[lang].listenFired,
            closeLabel: strings[lang].close,
          },
          onLevel: (rms) => updateListenMeter(rms),
          onLoud: () => {
            setListenStatus("listenFired", true);
            setTimeout(() => {
              if (listenCtrl && listenCtrl.active) setListenStatus("listenListening", false);
            }, 1800);
          },
          onStop: () => {
            // Sync UI when session ends (unload / explicit stop / stopOnHidden)
            if (listenCtrl && !listenCtrl.active) {
              listenCtrl = null;
              updateListenMeter(0);
              setListenStatus("listenIdle", false);
            }
          },
        });
        setListenStatus("listenListening", false);
      } catch (err) {
        listenCtrl = null;
        updateListenMeter(0);
        const key =
          err && (err.name === "NotAllowedError" || err.name === "PermissionDeniedError" || /denied/i.test(String(err.message)))
            ? "listenDenied"
            : "listenUnsupported";
        setListenStatus(key, false);
        demoBanner(strings[lang][key], { level: "warn", durationMs: 4000 });
      }
    });

    document.getElementById("btn-listen-stop").addEventListener("click", () => {
      stopLoudListen();
      listenCtrl = null;
      updateListenMeter(0);
      setListenStatus("listenIdle", false);
    });

    // Keep status text aligned with controller.active (e.g. after unload auto-stop)
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      if (listenCtrl && listenCtrl.active) {
        setListenStatus("listenListening", false);
      } else if (listenCtrl && !listenCtrl.active) {
        listenCtrl = null;
        updateListenMeter(0);
        setListenStatus("listenIdle", false);
      }
    });

    // PWA: service worker + optional install prompt
    if (
      "serviceWorker" in navigator &&
      (location.protocol === "https:" ||
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1")
    ) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById("btn-install");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
      installBtn.style.display = "block";
    });
    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      installBtn.hidden = true;
      installBtn.style.display = "none";
    });
    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try {
        await deferredPrompt.userChoice;
      } catch (_) {}
      deferredPrompt = null;
      installBtn.hidden = true;
      installBtn.style.display = "none";
    });
  </script>
</body>
</html>
